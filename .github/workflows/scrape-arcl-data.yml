name: Scrape ARCL Data → Azure PostgreSQL

on:
  schedule:
    # Every Monday at 6 AM PT (1 PM UTC) — after weekend matches are complete
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      all_seasons:
        description: 'Scrape all seasons (not just current)'
        required: false
        default: false
        type: boolean
      no_scorecards:
        description: 'Skip scorecards (faster, but only gets top-25 leaderboard data)'
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 psycopg2-binary python-dotenv

      - name: Run scraper → Azure PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.all_seasons }}" = "true" ]; then
            ARGS="$ARGS --all-seasons"
          fi
          if [ "${{ github.event.inputs.no_scorecards }}" = "true" ]; then
            ARGS="$ARGS --no-scorecards"
          fi
          python -m scrapers.arcl_scraper $ARGS
